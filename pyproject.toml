[project]
name = "floodwatch"
version = "0.1.0"
description = "Flash-flood early warning for Freetown, Sierra Leone, built from open data before any sensors exist."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "eccodes>=2.38",
  "matplotlib>=3.8",
  # pysheds 0.5 still calls numpy.in1d, removed in numpy 2.4
  "numpy>=1.26,<2.4",
  "pandas>=2.2",
  "pysheds>=0.5",
  "rasterio>=1.3",
  "shapely>=2.0",
  "requests>=2.31",
  "utide>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
floodwatch = "floodwatch.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
