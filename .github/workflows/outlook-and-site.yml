# Daily flood Outlook + website.
#
# Twice a day: issue the 3-day Outlook, commit the bulletin and the forecast
# archive to main, rebuild the website and publish it on GitHub Pages.
# Morning issue: ECMWF 00 UTC run (published ~07:40 UTC), calendar days.
# Evening issue: ECMWF 12 UTC run (published ~19:40 UTC), noon-to-noon periods,
# so the night (when most Freetown floods happen) gets a fresh forecast.
# On every push to main: rebuild and publish the website only.
#
# One-time setup (repository settings):
#   * Settings > Pages > Build and deployment > Source: "GitHub Actions".
#   * Settings > Secrets and variables > Actions > New repository secret
#     EARTHDATA_TOKEN = a NASA Earthdata Login token (for observed rain).
#     Without it the Outlook still runs, but ground wetness shows as unknown.
#     Earthdata tokens expire after 60 days; replace the secret when it does.
#
# Who the schedule runs as: GitHub runs the two scheduled issues as the account
# that authored the last change to the cron lines below. If that account has no
# write access to this repository, GitHub skips the schedule without any error.
# This happened from 22 to 23 November 2026: the lines were last changed in
# commits linked to the "claude" account, so no scheduled run ever started.
# After any change to the cron lines, merge with "Squash and merge" and check
# that the commit author shown before merging is the repository owner. Then
# check the Actions tab for a run with the event "schedule" after the next time.

name: Daily outlook and website

on:
  schedule:
    - cron: "12 8 * * *" # morning issue, 08:12 UTC (Freetown is on UTC); the 00 UTC run is out by ~07:40
    - cron: "46 20 * * *" # evening issue, 20:46 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: outlook-and-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Issue the Outlook (morning or evening, by the clock)
        if: github.event_name != 'push'
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          if [ -z "$EARTHDATA_TOKEN" ]; then
            echo "::warning title=No NASA Earthdata token::The EARTHDATA_TOKEN repository secret is not set, so the Outlook cannot see recent rain (ground wetness unknown). Add it under Settings > Secrets and variables > Actions."
          fi
          floodwatch outlook

      - name: Commit the Outlook and forecast archive
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/outlook data/archive
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Outlook $(date -u '+%F %H:%M') UTC"
            git push
          fi

      - name: Build the website
        run: floodwatch site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true  # keep .nojekyll; v4+ drops dotfiles by default

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
